name: Deploy Frontend

on:
  push:
    branches: [dev, main]
    paths:
      - "services/frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-frontend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./services/frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
          build-args: |
            NEXT_PUBLIC_AGENT_URL=${{ github.ref == 'refs/heads/main' && 'http://prod.adan.fursa.click:8000' || 'http://localhost:8000' }}
      - name: Deploy Frontend to Dev
        if: github.ref == 'refs/heads/dev'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: adan-dev.fursa.click
          username: ubuntu
          key: ${{ secrets.DEV_INSTANCE_SSH_KEY }}
          command_timeout: 10m
          script: |
            cd ~/PolyAIFursa-AdanHammod
            git pull origin dev

            mkdir -p services/frontend
            touch services/frontend/.env

            touch .env
            grep -q "^DOCKERHUB_USERNAME=" .env && sed -i "s|^DOCKERHUB_USERNAME=.*|DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}|" .env || echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" >> .env
            grep -q "^FRONTEND_IMAGE_TAG=" .env && sed -i "s|^FRONTEND_IMAGE_TAG=.*|FRONTEND_IMAGE_TAG=${{ github.sha }}|" .env || echo "FRONTEND_IMAGE_TAG=${{ github.sha }}" >> .env

            docker compose pull frontend
            docker compose up -d --no-build frontend

      - name: Deploy Frontend to Prod
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: prod.adan.fursa.click
          username: ubuntu
          key: ${{ secrets.PROD_INSTANCE_SSH_KEY }}
          command_timeout: 10m
          script: |
            cd ~/PolyAIFursa-AdanHammod
            git pull origin main

            touch .env
            grep -q "^DOCKERHUB_USERNAME=" .env && sed -i "s|^DOCKERHUB_USERNAME=.*|DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}|" .env || echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" >> .env
            grep -q "^FRONTEND_IMAGE_TAG=" .env && sed -i "s|^FRONTEND_IMAGE_TAG=.*|FRONTEND_IMAGE_TAG=${{ github.sha }}|" .env || echo "FRONTEND_IMAGE_TAG=${{ github.sha }}" >> .env

            docker compose pull frontend
            docker compose up -d --no-build frontend
