name: Deploy Image Processing MCP

on:
  push:
    branches: [dev, main]
    paths:
      - "services/img-proc-mcp/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-img-proc-mcp.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push MCP image
        uses: docker/build-push-action@v6
        with:
          context: ./services/img-proc-mcp
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/img-proc-mcp:${{ github.sha }}

      - name: Deploy MCP to Dev
        if: github.ref == 'refs/heads/dev'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: adan-dev.fursa.click
          username: ubuntu
          key: ${{ secrets.DEV_INSTANCE_SSH_KEY }}
          command_timeout: 10m
          script: |
            cd ~/PolyAIFursa-AdanHammod
            git pull origin dev

            touch .env
            grep -q "^DOCKERHUB_USERNAME=" .env && sed -i "s|^DOCKERHUB_USERNAME=.*|DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}|" .env || echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" >> .env
            grep -q "^IMG_PROC_MCP_IMAGE_TAG=" .env && sed -i "s|^IMG_PROC_MCP_IMAGE_TAG=.*|IMG_PROC_MCP_IMAGE_TAG=${{ github.sha }}|" .env || echo "IMG_PROC_MCP_IMAGE_TAG=${{ github.sha }}" >> .env

            docker compose pull img-proc-mcp
            docker compose up -d --no-build img-proc-mcp

      - name: Deploy MCP to Prod
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: prod.adan.fursa.click
          username: ubuntu
          key: ${{ secrets.PROD_INSTANCE_SSH_KEY }}
          command_timeout: 10m
          script: |
            cd ~/PolyAIFursa-AdanHammod
            git pull origin main

            touch .env
            grep -q "^DOCKERHUB_USERNAME=" .env && sed -i "s|^DOCKERHUB_USERNAME=.*|DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}|" .env || echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" >> .env
            grep -q "^IMG_PROC_MCP_IMAGE_TAG=" .env && sed -i "s|^IMG_PROC_MCP_IMAGE_TAG=.*|IMG_PROC_MCP_IMAGE_TAG=${{ github.sha }}|" .env || echo "IMG_PROC_MCP_IMAGE_TAG=${{ github.sha }}" >> .env

            docker compose pull img-proc-mcp
            docker compose up -d --no-build img-proc-mcp
