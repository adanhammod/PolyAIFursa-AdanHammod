name: Deploy Agent

on:
  push:
    branches: [dev, main]
    paths:
      - "services/agent/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-agent.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push agent image
        uses: docker/build-push-action@v6
        with:
          context: ./services/agent
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/agent-service:${{ github.sha }}

      - name: Deploy agent
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/PolyAIFursa-AdanHammod
            git pull origin ${{ github.ref_name }}

            touch .env
            grep -q "^DOCKERHUB_USERNAME=" .env && sed -i "s|^DOCKERHUB_USERNAME=.*|DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}|" .env || echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" >> .env
            grep -q "^AGENT_IMAGE_TAG=" .env && sed -i "s|^AGENT_IMAGE_TAG=.*|AGENT_IMAGE_TAG=${{ github.sha }}|" .env || echo "AGENT_IMAGE_TAG=${{ github.sha }}" >> .env

            docker compose pull agent
            docker compose up -d --no-build agent