name: Deploy Agent

on:
  push:
    branches: [dev, main]
    paths:
      - "services/agent/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-agent.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Agent image
        uses: docker/build-push-action@v6
        with:
          context: ./services/agent
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/agent-service:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/agent-service:${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

      - name: Deploy Agent to Dev
        if: github.ref == 'refs/heads/dev'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: adan-dev.fursa.click
          username: ubuntu
          key: ${{ secrets.DEV_INSTANCE_SSH_KEY }}
          command_timeout: 10m
          script: |
            cd ~/PolyAIFursa-AdanHammod
            git pull origin dev

            touch .env
            grep -q "^DOCKERHUB_USERNAME=" .env && sed -i "s|^DOCKERHUB_USERNAME=.*|DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}|" .env || echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" >> .env
            grep -q "^AGENT_IMAGE_TAG=" .env && sed -i "s|^AGENT_IMAGE_TAG=.*|AGENT_IMAGE_TAG=${{ github.sha }}|" .env || echo "AGENT_IMAGE_TAG=${{ github.sha }}" >> .env

            docker compose pull agent
            docker compose up -d --no-build img-proc-mcp
            docker compose up -d --no-build agent

            sleep 5
            docker compose ps agent
            docker compose logs agent --tail=80

      - name: Deploy Agent to Prod
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: prod.adan.fursa.click
          username: ubuntu
          key: ${{ secrets.PROD_INSTANCE_SSH_KEY }}
          command_timeout: 10m
          script: |
            cd ~/PolyAIFursa-AdanHammod
            git pull origin main

            touch .env
            grep -q "^DOCKERHUB_USERNAME=" .env && sed -i "s|^DOCKERHUB_USERNAME=.*|DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}|" .env || echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" >> .env
            grep -q "^AGENT_IMAGE_TAG=" .env && sed -i "s|^AGENT_IMAGE_TAG=.*|AGENT_IMAGE_TAG=${{ github.sha }}|" .env || echo "AGENT_IMAGE_TAG=${{ github.sha }}" >> .env

            docker compose pull agent
            docker compose up -d --no-build img-proc-mcp
            docker compose up -d --no-build agent

            sleep 5
            docker compose ps agent
            docker compose logs agent --tail=80
