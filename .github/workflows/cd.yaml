name: Kubernetes CD

on:
  push:
    branches:
      - dev
      - main

    paths:
      - "services/**"
      - ".github/workflows/cd.yaml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: kubernetes-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build Images and Update Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Deployment Environment
        id: environment
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
            echo "manifest_dir=infra/k8s/prod" >> "$GITHUB_OUTPUT"
            echo "image_tag=prod-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "frontend_agent_url=http://prod.adan.fursa.click:8000" >> "$GITHUB_OUTPUT"
          else
            echo "environment=dev" >> "$GITHUB_OUTPUT"
            echo "manifest_dir=infra/k8s/dev" >> "$GITHUB_OUTPUT"
            echo "image_tag=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "frontend_agent_url=http://adan-dev.fursa.click:8000" >> "$GITHUB_OUTPUT"
          fi

          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Commit: ${GITHUB_SHA}"
          echo "Environment configuration created successfully."

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./services/frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ steps.environment.outputs.image_tag }}
          build-args: |
            NEXT_PUBLIC_AGENT_URL=${{ steps.environment.outputs.frontend_agent_url }}

      - name: Build and Push Agent
        uses: docker/build-push-action@v6
        with:
          context: ./services/agent
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/agent-service:${{ steps.environment.outputs.image_tag }}

      - name: Build and Push YOLO
        uses: docker/build-push-action@v6
        with:
          context: ./services/yolo
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/yolo-service:${{ steps.environment.outputs.image_tag }}

      - name: Build and Push Image Processing MCP
        uses: docker/build-push-action@v6
        with:
          context: ./services/img-proc-mcp
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/img-proc-mcp:${{ steps.environment.outputs.image_tag }}

      - name: Update Kubernetes Manifests
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST_DIR="${{ steps.environment.outputs.manifest_dir }}"
          IMAGE_TAG="${{ steps.environment.outputs.image_tag }}"
          DOCKERHUB_USER="${{ secrets.DOCKERHUB_USERNAME }}"

          echo "Updating Kubernetes manifests in ${MANIFEST_DIR}..."

          sed -i \
            "s|image: .*frontend:.*|image: ${DOCKERHUB_USER}/frontend:${IMAGE_TAG}|g" \
            "${MANIFEST_DIR}/frontend-deployment.yaml"

          sed -i \
            "s|image: .*agent-service:.*|image: ${DOCKERHUB_USER}/agent-service:${IMAGE_TAG}|g" \
            "${MANIFEST_DIR}/agent-deployment.yaml"

          sed -i \
            "s|image: .*yolo-service:.*|image: ${DOCKERHUB_USER}/yolo-service:${IMAGE_TAG}|g" \
            "${MANIFEST_DIR}/yolo-deployment.yaml"

          sed -i \
            "s|image: .*img-proc-mcp:.*|image: ${DOCKERHUB_USER}/img-proc-mcp:${IMAGE_TAG}|g" \
            "${MANIFEST_DIR}/img-proc-mcp-deployment.yaml"

          echo "Updated images:"

          grep -R "^[[:space:]]*image:" \
            "${MANIFEST_DIR}/frontend-deployment.yaml" \
            "${MANIFEST_DIR}/agent-deployment.yaml" \
            "${MANIFEST_DIR}/yolo-deployment.yaml" \
            "${MANIFEST_DIR}/img-proc-mcp-deployment.yaml"

      - name: Validate Manifest Changes
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          echo "Changed files:"
          git status --short

      - name: Create Manifest Update Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}

          base: ${{ github.ref_name }}

          branch: cd/update-${{ steps.environment.outputs.environment }}-manifests
          delete-branch: true

          add-paths: |
            ${{ steps.environment.outputs.manifest_dir }}/*.yaml

          commit-message: >-
            chore(cd): update
            ${{ steps.environment.outputs.environment }}
            image tags to
            ${{ steps.environment.outputs.image_tag }}

          title: >-
            chore(cd): update
            ${{ steps.environment.outputs.environment }}
            Kubernetes image tags

          body: |
            ## Automated Kubernetes Manifest Update

            This Pull Request was created automatically by the Kubernetes CD workflow.

            **Environment:** `${{ steps.environment.outputs.environment }}`

            **Source branch:** `${{ github.ref_name }}`

            **Source commit:** `${{ github.sha }}`

            **Docker image tag:** `${{ steps.environment.outputs.image_tag }}`

            ### Updated services

            - Frontend
            - Agent
            - YOLO
            - Image Processing MCP

            After this Pull Request is merged, ArgoCD will detect the Kubernetes manifest changes and synchronize the relevant environment.

          labels: |
            automated
            kubernetes
            cd

      - name: Print Pull Request Result
        shell: bash
        run: |
          if [[ -n "${{ steps.create-pr.outputs.pull-request-number }}" ]]; then
            echo "Pull Request created or updated successfully."
            echo "PR number: ${{ steps.create-pr.outputs.pull-request-number }}"
            echo "PR URL: ${{ steps.create-pr.outputs.pull-request-url }}"
          else
            echo "No Pull Request was created because the manifests did not change."
          fi
