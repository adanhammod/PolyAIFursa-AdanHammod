name: Kubernetes CD

on:
  push:
    branches:
      - dev
      - main

    # ה-Workflow ירוץ רק כאשר השתנה קוד של שירות
    # או כאשר שינינו את ה-Workflow עצמו.
    # Commit אוטומטי שמשנה רק infra/k8s לא יפעיל אותו שוב.
    paths:
      - "services/**"
      - ".github/workflows/cd.yaml"

permissions:
  contents: write

concurrency:
  group: kubernetes-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set deployment environment
        id: environment
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
            echo "manifest_dir=infra/k8s/prod" >> "$GITHUB_OUTPUT"
            echo "image_tag=prod-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "frontend_agent_url=http://prod.adan.fursa.click:8000" >> "$GITHUB_OUTPUT"
          else
            echo "environment=dev" >> "$GITHUB_OUTPUT"
            echo "manifest_dir=infra/k8s/dev" >> "$GITHUB_OUTPUT"
            echo "image_tag=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "frontend_agent_url=http://adan-dev.fursa.click:8000" >> "$GITHUB_OUTPUT"
          fi

          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Commit: ${GITHUB_SHA}"

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./services/frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ steps.environment.outputs.image_tag }}
          build-args: |
            NEXT_PUBLIC_AGENT_URL=${{ steps.environment.outputs.frontend_agent_url }}

      - name: Build and Push Agent
        uses: docker/build-push-action@v6
        with:
          context: ./services/agent
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/agent-service:${{ steps.environment.outputs.image_tag }}

      - name: Build and Push YOLO
        uses: docker/build-push-action@v6
        with:
          context: ./services/yolo
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/yolo-service:${{ steps.environment.outputs.image_tag }}

      - name: Build and Push Image Processing MCP
        uses: docker/build-push-action@v6
        with:
          context: ./services/img-proc-mcp
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/img-proc-mcp:${{ steps.environment.outputs.image_tag }}

      - name: Update Kubernetes manifests
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST_DIR="${{ steps.environment.outputs.manifest_dir }}"
          IMAGE_TAG="${{ steps.environment.outputs.image_tag }}"
          DOCKERHUB_USER="${{ secrets.DOCKERHUB_USERNAME }}"

          sed -i \
            "s|image: .*frontend:.*|image: ${DOCKERHUB_USER}/frontend:${IMAGE_TAG}|g" \
            "${MANIFEST_DIR}/frontend-deployment.yaml"

          sed -i \
            "s|image: .*agent-service:.*|image: ${DOCKERHUB_USER}/agent-service:${IMAGE_TAG}|g" \
            "${MANIFEST_DIR}/agent-deployment.yaml"

          sed -i \
            "s|image: .*yolo-service:.*|image: ${DOCKERHUB_USER}/yolo-service:${IMAGE_TAG}|g" \
            "${MANIFEST_DIR}/yolo-deployment.yaml"

          sed -i \
            "s|image: .*img-proc-mcp:.*|image: ${DOCKERHUB_USER}/img-proc-mcp:${IMAGE_TAG}|g" \
            "${MANIFEST_DIR}/img-proc-mcp-deployment.yaml"

          echo "Updated images:"
          grep -R "^[[:space:]]*image:" \
            "${MANIFEST_DIR}/frontend-deployment.yaml" \
            "${MANIFEST_DIR}/agent-deployment.yaml" \
            "${MANIFEST_DIR}/yolo-deployment.yaml" \
            "${MANIFEST_DIR}/img-proc-mcp-deployment.yaml"

      - name: Commit updated manifests
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${{ steps.environment.outputs.manifest_dir }}"

          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit \
              -m "chore(cd): update ${{ steps.environment.outputs.environment }} image tags to ${{ steps.environment.outputs.image_tag }}"

            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push manifest changes
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
