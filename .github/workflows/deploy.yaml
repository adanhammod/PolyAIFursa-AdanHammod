name: Deploy PolyAI

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Dev instance
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.DEV_INSTANCE_SSH_KEY }}
          script: |
            cd ~/PolyAIFursa-AdanHammod
            git pull origin dev

            source .venv/bin/activate
            export TMPDIR=~/tmp

            pip install --no-cache-dir -r services/yolo/requirements.txt
            pip install --no-cache-dir -r services/agent/requirements.txt

            cd services/frontend
            npm install
            npm run build
            cd ../..

            sudo systemctl restart yolo.service
            sudo systemctl restart agent.service
            sudo systemctl restart frontend.service

            sleep 5
            sudo systemctl is-active --quiet yolo.service
            sudo systemctl is-active --quiet agent.service
            sudo systemctl is-active --quiet frontend.service
            echo "All services are running"

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Prod instance
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.PROD_INSTANCE_SSH_KEY }}
          script: |
            cd ~/PolyAIFursa-AdanHammod
            git pull origin main

            source .venv/bin/activate
            export TMPDIR=~/tmp

            pip install --no-cache-dir -r services/yolo/requirements.txt
            pip install --no-cache-dir -r services/agent/requirements.txt

            cd services/frontend
            npm install
            npm run build
            cd ../..

            sudo systemctl restart yolo.service
            sudo systemctl restart agent.service
            sudo systemctl restart frontend.service

            sleep 5
            sudo systemctl is-active --quiet yolo.service
            sudo systemctl is-active --quiet agent.service
            sudo systemctl is-active --quiet frontend.service
            echo "All services are running"
