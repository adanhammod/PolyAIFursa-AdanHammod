apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: polyai-argocd-ingress
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/adanhammod/PolyAIFursa-AdanHammod.git
    targetRevision: main
    path: infra/k8s/argocd
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
