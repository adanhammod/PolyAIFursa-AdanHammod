apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: polyai-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/adanhammod/PolyAIFursa-AdanHammod.git
    targetRevision: dev
    path: infra/k8s/dev
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
