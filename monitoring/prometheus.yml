global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "agent"
    static_configs:
      - targets:
          - "agent-svc:8000"

  - job_name: "yolo"
    static_configs:
      - targets:
          - "yolo-svc:8080"

  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "node-exporter:9100"
