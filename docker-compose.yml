services:
  yolo:
    build:
      context: ./services/yolo
    image: ${DOCKERHUB_USERNAME}/yolo-service:${YOLO_IMAGE_TAG:-local}
    ports:
      - "8080:8080"
    env_file:
      - ./services/yolo/.env
    labels:
      container_name: yolo-service
    logging:
      driver: json-file
      options:
        labels: container_name

  img-proc-mcp:
    build:
      context: ./services/img-proc-mcp
    image: ${DOCKERHUB_USERNAME}/img-proc-mcp:${IMG_PROC_MCP_IMAGE_TAG:-local}
    ports:
      - "9000:9000"
    environment:
      FASTMCP_PORT: 9000
    labels:
      container_name: img-proc-mcp
    logging:
      driver: json-file
      options:
        labels: container_name

  agent:
    build:
      context: ./services/agent
    image: ${DOCKERHUB_USERNAME}/agent-service:${AGENT_IMAGE_TAG:-local}
    ports:
      - "8000:8000"
    env_file:
      - ./services/agent/.env
    environment:
      YOLO_SERVICE_URL: http://yolo:8080
      IMG_PROC_MCP_URL: http://img-proc-mcp:9000
    depends_on:
      - yolo
      - img-proc-mcp
    labels:
      container_name: agent-service
    logging:
      driver: json-file
      options:
        labels: container_name

  frontend:
    build:
      context: ./services/frontend
    image: ${DOCKERHUB_USERNAME}/frontend:${FRONTEND_IMAGE_TAG:-local}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_AGENT_URL: http://adan-dev.fursa.click:8000
    depends_on:
      - agent
    labels:
      container_name: frontend-service
    logging:
      driver: json-file
      options:
        labels: container_name

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - agent
      - yolo
      - node-exporter
    labels:
      container_name: prometheus
    logging:
      driver: json-file
      options:
        labels: container_name

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    labels:
      container_name: grafana
    logging:
      driver: json-file
      options:
        labels: container_name

  node-exporter:
    image: prom/node-exporter:v1.8.2
    ports:
      - "9100:9100"
    labels:
      container_name: node-exporter
    logging:
      driver: json-file
      options:
        labels: container_name

  fluent-bit:
    image: fluent/fluent-bit:4.2.7
    container_name: fluent-bit
    restart: unless-stopped
    volumes:
      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log
    labels:
      container_name: fluent-bit
    logging:
      driver: json-file
      options:
        labels: container_name

  observability-mcp:
    build:
      context: ./services/observability-mcp
    image: ${DOCKERHUB_USERNAME}/observability-mcp:${OBSERVABILITY_MCP_IMAGE_TAG:-local}
    environment:
      AWS_REGION: us-east-1
      DEV_S3_LOGS_BUCKET: adan-polyai-logs-dev
      PROD_S3_LOGS_BUCKET: adan-polyai-logs-prod
      DEV_PROMETHEUS_URL: http://prometheus:9090
      PROD_PROMETHEUS_URL: http://prometheus:9090
    depends_on:
      - prometheus
    stdin_open: true
    labels:
      container_name: observability-mcp
    logging:
      driver: json-file
      options:
        labels: container_name      

volumes:
  grafana-data: